# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json
# Shared skillshare settings; install as ~/.config/skillshare/config.yaml via setup.sh.
sources:
  skills: ~/.agents/source
  agents: ~/.config/skillshare/agents
mode: merge
targets:
  universal:
    skills:
      path: ~/.agents/skills
ignore:
  - .DS_Store
  - .git/
  - __pycache__/
audit:
  block_threshold: CRITICAL
preserve_tilde_on_save: true
